configuration:
  marstek_network_settings:
    name: Marstek network
    description: >-
      How the battery is reached on your LAN.
      device_ip: IP address of the device, a static IP or DHCP reservation is
      strongly recommended.
      device_udp_port: the Open API port configured in the Marstek app,
      default 30000, recommended 49152-65535.
      device_ble_mac and device_type: leave empty, they are read during the
      first Marstek.GetDevice call and filled in automatically.
      local_udp_port: local source port, 0 = random. Some firmware versions
      only reply to a fixed port, then use the same value as device_udp_port.
  mqtt_settings:
    name: MQTT
    description: >-
      Broker connection and MQTT auto-discovery.
      mqtt_host and mqtt_port: the broker, core-mosquitto:1883 for the
      Mosquitto add-on.
      mqtt_username and mqtt_password: credentials, leave the user empty for an
      anonymous connection.
      mqtt_discovery_prefix: must match the MQTT integration setting, normally
      homeassistant.
      mqtt_base_topic: root of all state and command topics of this bridge.
      mqtt_suggested_area: area Home Assistant suggests when the devices are
      created.
  message_settings:
    name: Communication
    description: >-
      Timing of the UDP communication and of the watchdog.
      request_delay: pause between two commands in seconds, the battery does not
      handle parallel requests.
      request_timeout: timeout per single attempt.
      request_retries: 0 = single attempt, a timeout is discarded and does NOT
      trigger the watchdog. Greater than 0 = that many retries, if the last
      attempt also fails the watchdog is triggered.
      request_max_time: hard limit across all attempts of one message, exceeding
      it also triggers the watchdog.
      poll_enabled: cyclic polling on or off. Off = data is only read at
      start-up and through the refresh buttons.
      poll_interval: time between two polling cycles in seconds.
  additions_status_requests:
    name: Additional requests and start values
    description: >-
      Optional query plus the values applied once at start-up.
      enable_em: additionally query EM.GetStatus and create the "Marstek Energy
      Meter" device with the CT data.
      dod_value: depth of discharge in percent, valid range 30-88, factory value
      88. Can be changed any time via the number entity.
      ble_block_enable: enables the Bluetooth block (Ble.Adv) at start-up so the
      mobile app cannot connect in parallel and cause command conflicts.
      led_state: LED of the control panel, off = the LED is switched off at
      start-up.
      pv_energy_enabled: keeps an own PV energy counter that integrates
      pv_power from ES.GetStatus over the actually elapsed time, independent of
      the device counter (total_pv_energy). The value survives restarts.
      pv_energy_max_gap: largest gap in seconds between two samples that is
      still extrapolated. Longer pauses (restart, device offline) are discarded
      so the counter stays correct.
  passiv_mode_settings:
    name: Passive mode
    description: >-
      Limits and start values of the self-consumption control.
      passive_power_min and passive_power_max: bounds of the number entity in
      watts. Negative means charging from the grid, positive means feeding in or
      discharging.
      passive_power_default: power the entity starts with after a restart.
      passive_cd_time_max and passive_cd_time_default: countdown in seconds.
      When it expires the device leaves the passive setpoint again, the docs
      specify a maximum of 300 seconds.
      passive_keepalive: re-sends the passive command every cd_time/2 seconds,
      needed if the setpoint should be held permanently. With self-regulation
      active this happens in any case.
      self_regulation_enabled: initial state of the self-regulation. While
      active, the power sent is derived from the MQTT control value and the
      "Passive power" number entity only acts as the upper limit.
      self_regulation_topic: topic of the filtered control value. Empty = the
      topic <mqtt_base_topic>/energy_control/regulation_input. Accepts a plain
      number or JSON with value, state, power.
      self_regulation_mode: setpoint = the value already is the desired battery
      setpoint and is used directly. grid = the value is the grid power and is
      added to the previous setpoint.
      self_regulation_reserve: reserve in watts subtracted from the control
      value so grid import stays slightly positive instead of exporting. Typical
      values are 10-15 W.
      self_regulation_deadband: changes smaller than this value in watts do not
      trigger a new command.
      self_regulation_min_interval: minimum time between two control commands in
      seconds.
  general_settings:
    name: General
    description: >-
      Watchdog and add-on behaviour.
      watchdog_failure_threshold: number of consecutive watchdog triggers before
      the health endpoint turns unhealthy and the Supervisor restarts the
      add-on. Higher values prevent restart loops caused by short outages.
      persist_device_info: writes the Bluetooth MAC and device type back into
      this configuration via the Supervisor API once they have been read.
      health_port: port of the health endpoint (/health and /status) polled by
      the Supervisor watchdog. Changing it requires adjusting the add-on's
      watchdog entry.
  logging:
    name: Logging
    description: >-
      log_level: trace logs every single UDP and MQTT packet, debug every query
      step, info only the normal flow.
      log_full_line_color: on = the whole line is printed in the colour of its
      level. Off = only timestamp, level and logger name are coloured as
      accents, the message text stays neutral.
network:
  8099/tcp: Health endpoint for the Supervisor watchdog
