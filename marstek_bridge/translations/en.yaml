configuration:
  marstek_network_settings:
    name: Marstek network
    description: >-
      How the battery is reached on your LAN.
      device_ip: IP address of the device, a static IP or DHCP reservation is
      strongly recommended.
      device_udp_port: the Open API port configured in the Marstek app,
      default 30000, recommended 49152-65535.
      device_ble_mac and device_type: leave empty, they are read during the
      first Marstek.GetDevice call and filled in automatically.
      local_udp_port: local source port, 0 = random. Some firmware versions
      only reply to a fixed port, then use the same value as device_udp_port.
  mqtt_settings:
    name: MQTT
    description: >-
      Broker connection and MQTT auto-discovery.
      mqtt_host and mqtt_port: the broker, core-mosquitto:1883 for the
      Mosquitto add-on.
      mqtt_username and mqtt_password: credentials, leave the user empty for an
      anonymous connection.
      mqtt_discovery_prefix: must match the MQTT integration setting, normally
      homeassistant.
      mqtt_base_topic: root of all state and command topics of this bridge.
      mqtt_suggested_area: area Home Assistant suggests when the devices are
      created.
  message_settings:
    name: Communication
    description: >-
      Timing of the UDP communication and of the watchdog.
      request_delay: minimum pause between two UDP requests in seconds. Applies
      to everything: polling, control commands, keepalive and the refresh
      buttons. Otherwise the battery replies late and the request runs into a
      timeout although it is reachable.
      request_timeout: timeout per single attempt.
      request_retries: 0 = single attempt, a timeout is discarded and does NOT
      trigger the watchdog. Greater than 0 = that many retries, if the last
      attempt also fails the watchdog is triggered.
      request_max_time: hard limit across all attempts of one message, exceeding
      it also triggers the watchdog.
      poll_quiet_after_write: quiet period in seconds after a write command
      (ES.SetMode, DOD, LED, Bluetooth). No status query is started during that
      time - the battery is busy right afterwards and lets queries run into a
      timeout. An overdue query still runs once it exceeds twice its interval.
      0 = off.
      poll_only_at_rest: run status queries only while the controller is at
      rest - not while it waits for the device to react or for the signal to
      settle. During that time the device is working on the new setpoint and
      often lets queries run into a timeout; the values would be snapshots of a
      transition anyway. A query overdue by twice its interval still runs.
      poll_enabled: master switch for cyclic polling. Off = data is only read
      at start-up and through the refresh buttons, e.g. from a Home Assistant
      automation.
      poll_interval_es_status, poll_interval_battery, poll_interval_pv,
      poll_interval_mode, poll_interval_em: interval per query in seconds,
      0 disables that query. The queries differ a lot in value: ES.GetStatus
      carries the live power figures, Bat.GetStatus mainly the temperature,
      ES.GetMode rarely changes after start-up, and parts of PV.GetStatus are
      already contained in ES.GetStatus.
  additions_status_requests:
    name: Additional requests and start values
    description: >-
      Optional query plus the values applied once at start-up.
      enable_em: additionally query EM.GetStatus and create the "Marstek Energy
      Meter" device with the CT data.
      dod_value: depth of discharge in percent, valid range 30-88, factory value
      88. Can be changed any time via the number entity.
      ble_block_enable: enables the Bluetooth block (Ble.Adv) at start-up so the
      mobile app cannot connect in parallel and cause command conflicts.
      led_state: LED of the control panel, off = the LED is switched off at
      start-up.
      pv_energy_enabled: keeps an own PV energy counter that integrates
      pv_power from ES.GetStatus over the actually elapsed time, independent of
      the device counter (total_pv_energy). The value survives restarts.
      pv_energy_max_gap: largest gap in seconds between two samples that is
      still extrapolated. Longer pauses (restart, device offline) are discarded
      so the counter stays correct.
  passiv_mode_settings:
    name: Passive mode
    description: >-
      Limits and start values of the self-consumption control.
      passive_power_min and passive_power_max: bounds of the number entity in
      watts. Negative means charging from the grid, positive means feeding in or
      discharging.
      passive_power_default: power the entity starts with after a restart.
      passive_cd_time_max and passive_cd_time_default: countdown in seconds.
      When it expires the device leaves the passive setpoint again, the docs
      specify a maximum of 300 seconds.
      passive_keepalive: re-sends the passive command automatically, needed if
      the setpoint should be held permanently. With self-regulation active this
      happens in any case.
      passive_keepalive_interval: time between two keepalives in seconds. 0 =
      half the cd_time as before. Choose clearly less than cd_time, about a
      third - at exactly half the keepalive sits right on the edge and small
      delays let the device's countdown expire. Too small is not good either:
      every keepalive is a write command that keeps the battery busy, making it
      slower to answer status queries and control commands. The timer is reset
      by every passive command sent, including a control correction.
      self_regulation_enabled: initial state of the self-regulation. While
      active, the power sent is derived from the MQTT control value and the
      "Passive power" number entity only acts as the upper limit.
      self_regulation_topic: topic of the control value, expected to be the
      grid power with import positive. Empty = the topic
      <mqtt_base_topic>/energy_control/regulation_input. Accepts a plain number
      or JSON with value, state, power.
      self_regulation_settle_samples: this many consecutive samples must lie
      close together to count as settled. The window runs continuously -
      corrections only happen on a calm signal, no matter whether the unrest
      comes from the bridge's own correction or from a load change. Proven
      setup: one sample per second with 10 to 15 samples.
      self_regulation_settle_tolerance: allowed spread of those samples in
      watts. It has to be larger than the sensor noise, otherwise the signal
      never counts as settled and every correction goes through the timeout
      path with the smaller gain. With 12 samples and noise of +-3 W the
      typical spread is about 5 W.
      self_regulation_settle_tolerance: allowed spread of those samples in
      watts. Choose a larger value with a noisy load, otherwise the controller
      waits needlessly.
      self_regulation_settle_max_wait: if the signal does not settle within
      this time, a correction is made anyway, but with timeout_gain. 0 = wait
      indefinitely, then only export is corrected.
      self_regulation_settle_gain: fraction of the deviation compensated when
      regulating up once settled. 0.8 leaves margin, because overshooting here
      means export.
      self_regulation_settle_gain_down: the same for regulating down. 1.0 is
      the exact value - the new setpoint is setpoint plus grid value minus
      reserve, which puts the grid value exactly on the reserve. An error here
      lands on the import side and is harmless.
      self_regulation_fast_threshold: deviation in watts from which a
      correction is made immediately out of the resting state, without waiting
      for the signal to settle. Noise never gets that large - it is necessarily
      a real load event such as a fridge switching on or off. While the device
      is ramping up on the bridge's own correction the fast path does not
      apply, because the deviation is just as large there and would trigger a
      second correction for the same event. 0 = off.
      self_regulation_reaction_timeout: after a command the bridge first waits
      for the measurement to move at all - during the device's dead time it
      stands still, and a short sample window would wrongly count that as
      settled. If no movement appears (for instance because the correction was
      smaller than the noise), it continues after this time. 0 = do not wait
      for the reaction.
      self_regulation_timeout_gain: fraction compensated after
      settle_max_wait expires - smaller, because the measurement is not
      reliable then.
      self_regulation_reserve: upper edge of the hold band in watts and the
      target of every correction. Typical values are 10-15 W.
      self_regulation_base_load: base load in watts always present on this
      phase, used as a lower bound for the setpoint. A downward step stops
      there instead of falling through to 0 W. If export is still measured
      afterwards, the next step may go below, so that a base load set too high
      cannot force permanent export. 0 = off. Choose the value so that the
      clamp reads roughly the reserve and not 0 W - otherwise the lower bound
      binds on every return to base load and costs an extra control cycle.
      self_regulation_deadband_percent: scales the deadband linearly with the
      setpoint, with the base value as the lower bound. At high power small
      deviations matter little while every correction costs a command. 5 per
      cent gives 5 W up to a setpoint of 100 W, then 20 W at 400 W and 30 W at
      600 W. Applies to upward steps only - downward the base value stays,
      otherwise a small export would be silently tolerated at a high setpoint.
      0 = off.
      self_regulation_stuck_limit: this many commands in a row without any
      movement in the measurement before the control signal counts as
      unusable. The setpoint then falls to 0 W, Communication established
      switches to FAIL and the controller rests until the measurement moves
      again. This catches a sensor that is stuck but keeps publishing - then
      input_timeout does not trigger and the controller would drive the
      setpoint up to the cap. Only counted when the commanded change was
      clearly above the noise. 0 = off.
      self_regulation_band_low: lower edge of the hold band. Between this edge
      and the reserve nothing is regulated at all - a grid import below the
      reserve is better than the reserve itself. 0 = every export is corrected
      immediately; a small negative value tolerates brief excursions if
      measurement noise makes the controller too twitchy.
      self_regulation_deadband: deviation of the grid value in watts below
      which nothing is regulated, measured from the reserve. Reserve 8 plus
      deadband 5 therefore means: correction starts at 13 W of grid import.
      This applies to both directions - export is also corrected only after
      the signal has settled.
      self_regulation_input_timeout: seconds without a new control value after
      which the setpoint falls back to 0 W. Prevents the keepalive from
      re-sending the last value forever after a Home Assistant restart. 0 =
      off.
  general_settings:
    name: General
    description: >-
      Watchdog and add-on behaviour.
      watchdog_failure_threshold also applies to initialisation: if it aborts
      this many times in a row with a timeout, the health endpoint reports
      unhealthy and Communication established switches to FAIL.
      restore_state: restores the cap (passive power), the countdown, the
      self-regulation switch, the pre-selected mode and the last computed
      setpoint after a restart. If the device still reports passive mode in
      ES.GetMode, its measured power (ongrid_power) is used as the starting
      point instead. Without this option the controller starts at 0 W after
      every restart.
      watchdog_failure_threshold: number of consecutive watchdog triggers before
      the health endpoint turns unhealthy and the Supervisor restarts the
      add-on. Higher values prevent restart loops caused by short outages.
      persist_device_info: writes the Bluetooth MAC and device type back into
      this configuration via the Supervisor API once they have been read.
      health_port: port of the health endpoint (/health and /status) polled by
      the Supervisor watchdog. Changing it requires adjusting the add-on's
      watchdog entry.
  logging:
    name: Logging
    description: >-
      log_level: trace logs every single UDP and MQTT packet, debug every query
      step, calc adds the bridge's calculations on top of info (control steps
      with dead-time correction, keepalive, deadband, cap limits, PV energy
      counter) without the protocol noise of debug, info only the normal flow.
      log_full_line_color: on = the whole line is printed in the colour of its
      level. Off = only timestamp, level and logger name are coloured as
      accents, the message text stays neutral.
network:
  8099/tcp: Health endpoint for the Supervisor watchdog
