configuration:
  device_ip:
    name: Geräte-IP
    description: >-
      IP-Adresse des Marstek Speichers im lokalen Netz. Eine statische IP bzw.
      DHCP-Reservierung wird dringend empfohlen.
  device_udp_port:
    name: UDP-Port des Geräts
    description: >-
      Der in der Marstek-App gesetzte Port der Open API. Default 30000,
      empfohlen 49152-65535.
  device_ble_mac:
    name: Bluetooth-MAC (automatisch)
    description: >-
      Leer lassen. Wird nach dem ersten Marstek.GetDevice ausgelesen und hier
      automatisch zurückgeschrieben.
  device_type:
    name: Gerätetyp (automatisch)
    description: >-
      Leer lassen. Wird automatisch befüllt (z. B. VenusC) und in Home
      Assistant als Modellbezeichnung verwendet.
  local_udp_port:
    name: Lokaler Quellport
    description: >-
      0 = zufälliger Port. Einzelne Firmware-Stände antworten nur an einen
      festen Quellport - dann denselben Wert wie beim UDP-Port des Geräts
      eintragen.
  mqtt_host:
    name: MQTT-Broker
    description: Hostname oder IP des Brokers. Für das Mosquitto-Add-on core-mosquitto.
  mqtt_port:
    name: MQTT-Port
    description: Port des Brokers, üblicherweise 1883.
  mqtt_username:
    name: MQTT-Benutzer
    description: Benutzername des Brokers. Leer lassen für eine anonyme Verbindung.
  mqtt_password:
    name: MQTT-Passwort
    description: Passwort zum MQTT-Benutzer.
  mqtt_discovery_prefix:
    name: Discovery-Präfix
    description: >-
      Präfix der MQTT-Auto-Discovery. Muss zur Einstellung der
      MQTT-Integration passen, normalerweise homeassistant.
  mqtt_base_topic:
    name: Basis-Topic
    description: >-
      Wurzel aller Status- und Kommando-Topics dieser Bridge, z. B.
      Marstek-Bridge-Control/system/state.
  mqtt_suggested_area:
    name: Vorgeschlagener Bereich
    description: >-
      Bereich, den Home Assistant beim Anlegen der Geräte vorschlägt.
  request_delay:
    name: Pause zwischen Abfragen (s)
    description: >-
      Wartezeit zwischen zwei UDP-Kommandos. Der Speicher verträgt keine
      parallelen Anfragen; 1 Sekunde ist ein guter Startwert.
  request_timeout:
    name: Timeout je Versuch (s)
    description: Wie lange auf die Antwort eines einzelnen Versuchs gewartet wird.
  request_retries:
    name: Wiederholungen
    description: >-
      0 = nur ein Versuch, ein Timeout wird verworfen und löst KEINEN Watchdog
      aus. Größer 0 = so viele Wiederholungen; schlägt auch der letzte Versuch
      fehl, wird der Watchdog ausgelöst.
  request_max_time:
    name: Maximale Zeit je Nachricht (s)
    description: >-
      Hartes Limit über alle Versuche einer Nachricht. Wird es überschritten,
      bricht die Bridge ab und löst den Watchdog aus.
  poll_interval:
    name: Abfrageintervall (s)
    description: >-
      Abstand zwischen zwei Polling-Zyklen (Batterie, PV, ES.GetStatus,
      ES.GetMode und optional EM).
  poll_enabled:
    name: Zyklisches Abfragen
    description: >-
      Aus = es wird nur nach dem Start und beim Druck auf "Refresh data"
      abgefragt.
  enable_em:
    name: Energiezähler abfragen
    description: >-
      Zusätzlich EM.GetStatus abfragen und das Gerät "Marstek Energy Meter"
      mit den CT-Daten anlegen.
  dod_value:
    name: DOD (%)
    description: >-
      Entladetiefe, die beim Start gesetzt wird. Zulässig 30-88, Werkswert 88.
      Später jederzeit über die Number-Entity änderbar.
  ble_block_enable:
    name: Bluetooth-Sperre beim Start
    description: >-
      Aktiviert beim Start die Bluetooth-Sperre des Geräts (Ble.Adv). Verhindert,
      dass sich parallel die App verbindet und Befehle kollidieren.
  led_state:
    name: LED beim Start einschalten
    description: LED des Bedienpanels. Aus = LED wird beim Start abgeschaltet.
  passive_power_min:
    name: Minimale Passive-Leistung (W)
    description: >-
      Untere Grenze der Number-Entity. Negative Werte bedeuten Laden aus dem
      Netz, z. B. -1200.
  passive_power_max:
    name: Maximale Passive-Leistung (W)
    description: >-
      Obere Grenze der Number-Entity. Positive Werte bedeuten Einspeisen bzw.
      Entladen, z. B. 1200.
  passive_power_default:
    name: Passive-Leistung Startwert (W)
    description: Wert, mit dem die Number-Entity nach einem Neustart beginnt.
  passive_cd_time_max:
    name: Maximaler Countdown (s)
    description: >-
      Obergrenze für cd_time. Nach Ablauf des Countdowns verlässt das Gerät die
      Passive-Vorgabe wieder. Laut Doku maximal 300 Sekunden.
  passive_cd_time_default:
    name: Countdown Startwert (s)
    description: Wert, mit dem der Countdown nach einem Neustart beginnt.
  passive_keepalive:
    name: Passive automatisch nachsenden
    description: >-
      Sendet den Passive-Befehl automatisch alle cd_time/2 Sekunden erneut,
      solange Passive aktiv ist. Nötig, wenn die Vorgabe dauerhaft stehen soll.
  watchdog_failure_threshold:
    name: Watchdog-Schwelle
    description: >-
      Anzahl aufeinanderfolgender Watchdog-Auslösungen, bis der Health-Endpoint
      auf unhealthy wechselt und der Supervisor das Add-on neu startet. Höhere
      Werte verhindern Neustart-Schleifen bei kurzen Aussetzern.
  persist_device_info:
    name: Gerätedaten zurückschreiben
    description: >-
      Schreibt Bluetooth-MAC und Gerätetyp nach dem ersten Auslesen über die
      Supervisor-API in diese Konfiguration zurück.
  health_port:
    name: Health-Port
    description: >-
      Port des Health-Endpoints (/health und /status), den der
      Supervisor-Watchdog abfragt. Änderung erfordert eine Anpassung des
      watchdog-Eintrags im Add-on.
  log_level:
    name: Log-Level
    description: >-
      trace protokolliert jedes einzelne UDP- und MQTT-Paket, debug jeden
      Abfrageschritt, info nur den normalen Ablauf. Alle Level werden farbig
      ausgegeben.
network:
  8099/tcp: Health-Endpoint für den Supervisor-Watchdog
