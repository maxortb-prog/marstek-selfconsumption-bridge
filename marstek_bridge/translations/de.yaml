configuration:
  marstek_network_settings:
    name: Marstek Netzwerk
    description: >-
      Erreichbarkeit des Speichers im LAN.
      device_ip: IP-Adresse des Geräts, statische IP bzw. DHCP-Reservierung
      dringend empfohlen.
      device_udp_port: der in der Marstek-App gesetzte Port der Open API,
      Default 30000, empfohlen 49152-65535.
      device_ble_mac und device_type: leer lassen, werden nach dem ersten
      Marstek.GetDevice ausgelesen und automatisch hier eingetragen.
      local_udp_port: lokaler Quellport, 0 = zufällig. Einzelne Firmware-Stände
      antworten nur an einen festen Port, dann denselben Wert wie
      device_udp_port eintragen.
  mqtt_settings:
    name: MQTT
    description: >-
      Anbindung an den Broker und an die MQTT-Auto-Discovery.
      mqtt_host und mqtt_port: Broker, für das Mosquitto-Add-on
      core-mosquitto:1883.
      mqtt_username und mqtt_password: Zugangsdaten, Benutzer leer lassen für
      eine anonyme Verbindung.
      mqtt_discovery_prefix: muss zur Einstellung der MQTT-Integration passen,
      normalerweise homeassistant.
      mqtt_base_topic: Wurzel aller Status- und Kommando-Topics dieser Bridge.
      mqtt_suggested_area: Bereich, den Home Assistant beim Anlegen der Geräte
      vorschlägt.
  message_settings:
    name: Kommunikation
    description: >-
      Zeitverhalten der UDP-Kommunikation und des Watchdogs.
      request_delay: Pause zwischen zwei Kommandos in Sekunden, der Speicher
      verträgt keine parallelen Anfragen.
      request_timeout: Timeout je einzelnem Versuch.
      request_retries: 0 = nur ein Versuch, ein Timeout wird verworfen und löst
      KEINEN Watchdog aus. Größer 0 = so viele Wiederholungen, schlägt auch der
      letzte Versuch fehl, wird der Watchdog ausgelöst.
      request_max_time: hartes Limit über alle Versuche einer Nachricht, bei
      Überschreitung greift ebenfalls der Watchdog.
      poll_enabled: zyklisches Abfragen ein oder aus. Aus = es wird nur nach dem
      Start und über die Refresh-Buttons abgefragt.
      poll_interval: Abstand zwischen zwei Polling-Zyklen in Sekunden.
  additions_status_requests:
    name: Zusätzliche Abfragen und Startwerte
    description: >-
      Optionale Abfrage und die Werte, die beim Start einmalig gesetzt werden.
      enable_em: zusätzlich EM.GetStatus abfragen und das Gerät "Marstek Energy
      Meter" mit den CT-Daten anlegen.
      dod_value: Entladetiefe in Prozent, zulässig 30-88, Werkswert 88. Später
      jederzeit über die Number-Entity änderbar.
      ble_block_enable: aktiviert beim Start die Bluetooth-Sperre (Ble.Adv), so
      dass sich die App nicht parallel verbindet und Befehle kollidieren.
      led_state: LED des Bedienpanels, aus = LED wird beim Start abgeschaltet.
      pv_energy_enabled: fuehrt einen eigenen PV-Energiezaehler, der pv_power
      aus ES.GetStatus ueber die tatsaechlich vergangene Zeit integriert.
      Unabhaengig vom Zaehler des Geraets (total_pv_energy). Der Stand
      ueberlebt Neustarts.
      pv_energy_max_gap: groesste Luecke in Sekunden zwischen zwei Messwerten,
      die noch hochgerechnet wird. Laengere Pausen (Neustart, Geraet offline)
      werden verworfen, damit der Zaehler nicht verfaelscht wird.
  passiv_mode_settings:
    name: Passive-Modus
    description: >-
      Grenzen und Startwerte der Eigenverbrauchsregelung.
      passive_power_min und passive_power_max: Grenzen der Number-Entity in
      Watt. Negativ bedeutet Laden aus dem Netz, positiv Einspeisen bzw.
      Entladen.
      passive_power_default: Leistung, mit der die Entity nach einem Neustart
      beginnt.
      passive_cd_time_max und passive_cd_time_default: Countdown in Sekunden.
      Nach dessen Ablauf verlässt das Gerät die Passive-Vorgabe wieder, laut
      Doku maximal 300 Sekunden.
      passive_keepalive: sendet den Passive-Befehl automatisch alle cd_time/2
      Sekunden erneut, nötig wenn die Vorgabe dauerhaft stehen soll. Bei
      aktiver Selbstregelung geschieht das ohnehin immer.
      self_regulation_enabled: Startzustand der Selbstregelung. Ist sie aktiv,
      wird die gesendete Leistung aus dem MQTT-Regelwert berechnet und die
      Number-Entity "Passive power" dient nur noch als Obergrenze.
      self_regulation_topic: Topic des gefilterten Regelwerts. Leer = das Topic
      <mqtt_base_topic>/energy_control/regulation_input. Akzeptiert eine reine
      Zahl oder JSON mit value, state, power.
      self_regulation_mode: setpoint = der Wert ist bereits der gewünschte
      Sollwert des Speichers und wird direkt übernommen. grid = der Wert ist die
      Netzleistung und wird auf den bisherigen Sollwert aufsummiert.
      self_regulation_reserve: Reserve in Watt, die vom Regelwert abgezogen
      wird, damit der Netzbezug leicht positiv bleibt und nicht eingespeist
      wird. Übliche Werte 10-15 W.
      self_regulation_deadband: Änderungen kleiner als dieser Wert in Watt
      lösen kein neues Kommando aus.
      self_regulation_min_interval: minimaler Abstand zwischen zwei Regelbefehlen
      in Sekunden.
  general_settings:
    name: Allgemein
    description: >-
      Watchdog und Betriebsverhalten des Add-ons.
      watchdog_failure_threshold: Anzahl aufeinanderfolgender
      Watchdog-Auslösungen, bis der Health-Endpoint auf unhealthy wechselt und
      der Supervisor das Add-on neu startet. Höhere Werte verhindern
      Neustart-Schleifen bei kurzen Aussetzern.
      persist_device_info: schreibt Bluetooth-MAC und Gerätetyp nach dem ersten
      Auslesen über die Supervisor-API in diese Konfiguration zurück.
      health_port: Port des Health-Endpoints (/health und /status), den der
      Supervisor-Watchdog abfragt. Eine Änderung erfordert eine Anpassung des
      watchdog-Eintrags im Add-on.
  logging:
    name: Protokollierung
    description: >-
      log_level: trace protokolliert jedes einzelne UDP- und MQTT-Paket, debug
      jeden Abfrageschritt, info nur den normalen Ablauf.
      log_full_line_color: ein = die komplette Zeile wird in der Farbe des
      Levels ausgegeben. Aus = nur Zeitstempel, Level und Logger-Name werden
      als Akzente gefärbt, der Meldungstext bleibt neutral.
network:
  8099/tcp: Health-Endpoint für den Supervisor-Watchdog
