configuration:
  marstek_network_settings:
    name: Marstek Netzwerk
    description: >-
      Erreichbarkeit des Speichers im LAN.
      device_ip: IP-Adresse des Geräts, statische IP bzw. DHCP-Reservierung
      dringend empfohlen.
      device_udp_port: der in der Marstek-App gesetzte Port der Open API,
      Default 30000, empfohlen 49152-65535.
      device_ble_mac und device_type: leer lassen, werden nach dem ersten
      Marstek.GetDevice ausgelesen und automatisch hier eingetragen.
      local_udp_port: lokaler Quellport, 0 = zufällig. Einzelne Firmware-Stände
      antworten nur an einen festen Port, dann denselben Wert wie
      device_udp_port eintragen.
  mqtt_settings:
    name: MQTT
    description: >-
      Anbindung an den Broker und an die MQTT-Auto-Discovery.
      mqtt_host und mqtt_port: Broker, für das Mosquitto-Add-on
      core-mosquitto:1883.
      mqtt_username und mqtt_password: Zugangsdaten, Benutzer leer lassen für
      eine anonyme Verbindung.
      mqtt_discovery_prefix: muss zur Einstellung der MQTT-Integration passen,
      normalerweise homeassistant.
      mqtt_base_topic: Wurzel aller Status- und Kommando-Topics dieser Bridge.
      mqtt_suggested_area: Bereich, den Home Assistant beim Anlegen der Geräte
      vorschlägt.
  message_settings:
    name: Kommunikation
    description: >-
      Zeitverhalten der UDP-Kommunikation und des Watchdogs.
      request_delay: Mindestpause zwischen zwei UDP-Anfragen in Sekunden. Gilt
      fuer alles: Polling, Regelkommandos, Keepalive und die Refresh-Buttons.
      Der Speicher antwortet sonst verspaetet und die Anfrage laeuft in einen
      Timeout, obwohl er erreichbar ist.
      request_timeout: Timeout je einzelnem Versuch.
      request_retries: 0 = nur ein Versuch, ein Timeout wird verworfen und löst
      KEINEN Watchdog aus. Größer 0 = so viele Wiederholungen, schlägt auch der
      letzte Versuch fehl, wird der Watchdog ausgelöst.
      request_max_time: hartes Limit über alle Versuche einer Nachricht, bei
      Überschreitung greift ebenfalls der Watchdog.
      poll_enabled: Hauptschalter fuer das zyklische Abfragen. Aus = es wird
      nur nach dem Start und über die Refresh-Buttons abgefragt, etwa aus einer
      HA-Automation heraus.
      Abfragen laufen im freien Fenster zwischen dem Kommando und dem Beginn
      des Mittelungsfensters; danach sammelt die Bridge die Messwerte fuer den
      naechsten Regeltakt.
      poll_interval_es_status, poll_interval_battery, poll_interval_pv,
      poll_interval_mode, poll_interval_em: Intervall je Abfrage in Sekunden,
      0 schaltet die jeweilige Abfrage ab. Die Abfragen sind unterschiedlich
      ergiebig: ES.GetStatus liefert die laufenden Leistungswerte,
      Bat.GetStatus vor allem die Temperatur, ES.GetMode ist nach dem Start
      meist unveraendert und PV.GetStatus steckt in Teilen schon in
      ES.GetStatus.
  additions_status_requests:
    name: Zusätzliche Abfragen und Startwerte
    description: >-
      Optionale Abfrage und die Werte, die beim Start einmalig gesetzt werden.
      enable_em: zusätzlich EM.GetStatus abfragen und das Gerät "Marstek Energy
      Meter" mit den CT-Daten anlegen.
      dod_value: Entladetiefe in Prozent, zulässig 30-88, Werkswert 88. Später
      jederzeit über die Number-Entity änderbar.
      ble_block_enable: aktiviert beim Start die Bluetooth-Sperre (Ble.Adv), so
      dass sich die App nicht parallel verbindet und Befehle kollidieren.
      led_state: LED des Bedienpanels, aus = LED wird beim Start abgeschaltet.
      pv_energy_enabled: fuehrt einen eigenen PV-Energiezaehler, der pv_power
      aus ES.GetStatus ueber die tatsaechlich vergangene Zeit integriert.
      Unabhaengig vom Zaehler des Geraets (total_pv_energy). Der Stand
      ueberlebt Neustarts.
      pv_energy_max_gap: groesste Luecke in Sekunden zwischen zwei Messwerten,
      die noch hochgerechnet wird. Laengere Pausen (Neustart, Geraet offline)
      werden verworfen, damit der Zaehler nicht verfaelscht wird.
  passiv_mode_settings:
    name: Passive-Modus
    description: >-
      Grenzen und Startwerte der Eigenverbrauchsregelung.
      passive_power_min und passive_power_max: Grenzen der Number-Entity in
      Watt. Negativ bedeutet Laden aus dem Netz, positiv Einspeisen bzw.
      Entladen.
      passive_power_default: Leistung, mit der die Entity nach einem Neustart
      beginnt.
      passive_cd_time_max und passive_cd_time_default: Countdown in Sekunden.
      Nach dessen Ablauf verlässt das Gerät die Passive-Vorgabe wieder, laut
      Doku maximal 300 Sekunden.
      passive_keepalive: sendet den Passive-Befehl automatisch erneut, nötig
      wenn die Vorgabe dauerhaft stehen soll. Bei aktiver Selbstregelung
      geschieht das ohnehin immer.
      passive_keepalive_interval: Abstand zwischen zwei Keepalives in Sekunden.
      0 = die halbe cd_time wie bisher. Deutlich kleiner als die cd_time
      wählen, etwa ein Drittel - bei genau der Hälfte liegt der Keepalive
      direkt an der Grenze, und schon geringe Verzögerungen lassen den
      Countdown des Geräts ablaufen. Zu klein ist aber auch nicht gut: jedes
      Keepalive ist ein Schreibkommando und beschäftigt den Speicher, der dann
      auf Statusabfragen und Regelkommandos träger reagiert. Der Timer wird von
      jedem gesendeten Passive-Kommando zurückgesetzt, auch von einer
      Regelkorrektur.
      passive_jitter: aendert den gesendeten Leistungswert abwechselnd um
      diesen Betrag nach oben und unten. Das Geraet ueberwacht offenbar selbst,
      ob sich am Eingang etwas tut, und faehrt die Leistung nach ein bis zwei
      Minuten ohne erkennbare Aenderung auf 0 zurueck - bei konstanter
      Grundlast ohne Lastwechsel passiert genau das. Ein Wechsel um ein bis
      zwei Watt haelt die Erkennung wach. Betroffen ist nur der gesendete Wert,
      der interne Sollwert und die Regelrechnung bleiben unberuehrt. 0 = aus.
      self_regulation_enabled: Startzustand der Selbstregelung. Ist sie aktiv,
      wird die gesendete Leistung aus dem MQTT-Regelwert berechnet und die
      Number-Entity "Passive power" dient nur noch als Obergrenze.
      self_regulation_topic: Topic des Regelwerts, erwartet wird die
      Netzleistung mit Bezug positiv. Leer = das Topic
      <mqtt_base_topic>/energy_control/regulation_input. Akzeptiert eine reine
      Zahl oder JSON mit value, state, power.
      self_regulation_gain: Anteil der Abweichung, der je Regeltakt
      ausgeglichen wird. Der Takt ist der Keepalive-Takt - es muss ohnehin
      regelmaessig ein Kommando raus, und genau davor wird gemessen und
      gerechnet. Der Wert muss unter dem Anteil liegen, den das Geraet bis zur
      Messung schon umgesetzt hat, sonst schwingt die Regelung: bei 20 s Takt
      und rund 23 s Einschwingzeit sind 0.7 bis 0.8 passend.
      self_regulation_average_window: Laenge des Mittelungsfensters in Sekunden
      direkt vor einem Kommando. Gemittelt wird nur ueber Werte, die nach dem
      letzten Kommando eingetroffen sind.
      self_regulation_export_margin: zusaetzlicher Abschlag in Prozent der
      berechneten Korrektur bei einer Einspeise-Korrektur, damit das Ergebnis
      eher im Netzbezug landet als erneut im Negativen. Bewusst auf die
      Korrektur bezogen und nicht auf den Sollwert: bei 300 W Sollwert waeren
      5 Prozent sonst immer 15 W, egal ob 0,5 W oder 200 W eingespeist wurden.
      Je Takt wird hoechstens eine solche Korrektur ausgefuehrt.
      self_regulation_reserve: obere Kante des Haltebands in Watt und Ziel
      jeder Korrektur. Uebliche Werte 10-15 W.
      self_regulation_base_load: Grundlast in Watt, die auf dieser Phase
      ohnehin anliegt - als Untergrenze fuer den Sollwert. Ein Abwaertsschritt
      stoppt dort, statt bis auf 0 W durchzufallen. Wird danach immer noch
      Einspeisung gemessen, darf der naechste Schritt darunter, damit eine zu
      hoch eingestellte Grundlast keine dauerhafte Einspeisung erzwingt.
      0 = aus. Setze den Wert so, dass die Messklemme dabei etwa die Reserve
      anzeigt und nicht 0 W - sonst bindet die Untergrenze bei jeder Rueckkehr
      zur Grundlast und kostet einen zusaetzlichen Regelzyklus.
      self_regulation_deadband_percent: skaliert das Totband linear mit dem
      Sollwert, mit dem Grundwert als Untergrenze. Bei hoher Leistung sind
      kleine Abweichungen relativ bedeutungslos und jede Korrektur kostet ein
      Kommando. 5 Prozent ergeben 5 W bis 100 W Sollwert, dann 20 W bei 400 W
      und 30 W bei 600 W. Gilt nur beim Hochregeln - nach unten bleibt der
      Grundwert, sonst wuerde bei hohem Sollwert eine kleine Einspeisung
      stillschweigend toleriert. 0 = aus.
      self_regulation_stuck_limit: so viele Kommandos in Folge ohne jede
      Bewegung im Messwert, bis das Regelsignal als unbrauchbar gilt. Dann
      faellt der Sollwert auf 0 W, Communication established wechselt auf FAIL
      und die Regelung ruht, bis sich der Messwert wieder bewegt. Faengt den
      Fall ab, dass ein Sensor haengt, aber weiter publiziert - dann greift
      input_timeout nicht und die Regelung wuerde den Sollwert bis zum Deckel
      hochtreiben. Gezaehlt wird nur, wenn die befohlene Aenderung deutlich
      ueber dem Rauschen lag. 0 = aus.
      self_regulation_band_low: untere Kante des Haltebands. Zwischen dieser
      Kante und der Reserve wird gar nicht geregelt - ein Netzbezug unterhalb
      der Reserve ist besser als die Reserve selbst. 0 = jede Einspeisung wird
      sofort korrigiert; ein kleiner negativer Wert toleriert kurze Ausreisser
      ins Negative, falls die Regelung durch Messrauschen zu nervoes wird.
      self_regulation_deadband: Abstand zum Halteband in Watt, unter dem nicht
      geregelt wird. Nach oben gerechnet ab der Reserve, nach unten ab
      band_low: Reserve 8 plus Totband 5 heisst 13 W Netzbezug, band_low 0 plus
      Totband 5 heisst 5 W Einspeisung. Korrigiert wird danach immer auf die
      Reserve.
      self_regulation_underdelivery: Abweichung in Watt von der erwarteten
      Ausgangsleistung, ab der das Geraet als "hat eigenmaechtig reduziert"
      gilt. Unmittelbar vor jedem Regeltakt fragt die Bridge ES.GetStatus ab -
      zu dem Zeitpunkt ist das Geraet auf die aktuelle Vorgabe eingeschwungen.
      Zwischen Vorgabe und gemeldeter Leistung liegt ein weitgehend konstanter
      Verlust (gemessen rund 15 W bei 130 W wie bei 300 W Vorgabe), der als
      gleitender Mittelwert gelernt wird. Liegt die Meldung deutlich unter
      Vorgabe minus Verlust, ist der Anstieg an der Leistungsklemme dem
      Speicher zuzuschreiben und nicht einem Verbraucher: das Mittelungsfenster
      wird verworfen und derselbe Sollwert erneut gesendet, statt nach oben zu
      korrigieren. 0 = aus.
      self_regulation_input_timeout: Sekunden ohne neuen Regelwert, nach denen
      der Sollwert auf 0 W faellt. Verhindert, dass der Keepalive nach einem
      HA-Neustart endlos den letzten Wert weitersendet. 0 = aus.
  plan_settings:
    name: Lade- und Entladeplanung
    description: >-
      Rechnet die Flugbahn des Speichers bis zum PV-Beginn fort und meldet sie
      in der Geraetegruppe "Marstek Energy Plan". Sie greift nicht in die
      Regelung ein - der Deckel bleibt in deiner Hand oder in der einer
      HA-Automation, die sich an "Required cap" orientieren kann.
      plan_enabled: Planung ein oder aus.
      plan_forecast_topic: Topic mit der PV-Prognose fuer morgen in Wh. Leer =
      <mqtt_base_topic>/energy_plan/forecast. Gebraucht wird sie nur fuer die
      Meldung, wieviel Platz im Speicher fehlt.
      plan_pv_start: Uhrzeit, ab der mit nennenswerter PV-Leistung zu rechnen
      ist - nicht der Sonnenaufgang. Bestimmt, wie lange die Energie reichen
      muss. Saisonal nachziehen.
      plan_target_soc: Grenze, unter die der Speicher nicht entladen werden
      soll. Wird sie erreicht, liefert das Geraet nichts mehr, verbraucht sich
      aber im Standby weiter und laedt sich irgendwann teuer aus dem Netz nach.
      Mit Abstand ueber dem DOD-Stopp waehlen.
      plan_charge_threshold: ab dieser Leistung in Watt gilt ein negativer
      ongrid_power als Ladung aus dem Netz. Unterschieden wird gewollt (wir
      haben negative Leistung befohlen) und eigenmaechtig.
  general_settings:
    name: Allgemein
    description: >-
      Watchdog und Betriebsverhalten des Add-ons.
      watchdog_failure_threshold gilt auch fuer die Initialisierung: bricht sie
      so oft hintereinander mit einem Timeout ab, meldet der Health-Endpoint
      unhealthy und Communication established wechselt auf FAIL.
      restore_state: stellt nach einem Neustart den Deckel (Passive power), den
      Countdown, den Schalter der Selbstregelung, den vorgemerkten Modus und
      den zuletzt berechneten Sollwert wieder her. Meldet das Geraet in
      ES.GetMode noch den Passive-Modus, wird stattdessen dessen gemessene
      Leistung (ongrid_power) als Startwert genommen. Ohne diese Option beginnt
      die Regelung nach jedem Neustart bei 0 W.
      watchdog_failure_threshold: Anzahl aufeinanderfolgender
      Watchdog-Auslösungen, bis der Health-Endpoint auf unhealthy wechselt und
      der Supervisor das Add-on neu startet. Höhere Werte verhindern
      Neustart-Schleifen bei kurzen Aussetzern.
      persist_device_info: schreibt Bluetooth-MAC und Gerätetyp nach dem ersten
      Auslesen über die Supervisor-API in diese Konfiguration zurück.
      health_port: Port des Health-Endpoints (/health und /status), den der
      Supervisor-Watchdog abfragt. Eine Änderung erfordert eine Anpassung des
      watchdog-Eintrags im Add-on.
  logging:
    name: Protokollierung
    description: >-
      log_level: trace protokolliert jedes einzelne UDP- und MQTT-Paket, debug
      jeden Abfrageschritt, plan zusaetzlich zu info die Lade- und
      Entladeplanung, calc zeigt zusaetzlich zu info die Rechenwege der
      Bridge (Regelschritte samt Totzeit-Korrektur, Keepalive, Totband,
      Deckelgrenzen, PV-Energiezaehler) ohne das Protokoll-Rauschen von debug,
      info nur den normalen Ablauf.
      log_full_line_color: ein = die komplette Zeile wird in der Farbe des
      Levels ausgegeben. Aus = nur Zeitstempel, Level und Logger-Name werden
      als Akzente gefärbt, der Meldungstext bleibt neutral.
network:
  8099/tcp: Health-Endpoint für den Supervisor-Watchdog
