name: Marstek Self-consumption Bridge
version: "0.2.2"
slug: marstek_bridge
description: >-
  Marstek for Self-consumption regulation (MQTT - UDP Bridge). Steuert Marstek
  Venus Speicher ueber die lokale UDP Open API und bildet sie via MQTT
  Auto-Discovery in Home Assistant ab.
url: https://github.com/maxortb-prog/marstek-selfconsumption-bridge
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# Host-Netzwerk ist noetig, damit UDP-Broadcast (Marstek.GetDevice) und die
# Antwortpakete des Speichers ohne NAT-Umweg ankommen.
host_network: true
hassio_api: true
hassio_role: manager
services:
  - mqtt:want
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Health-Endpoint fuer den Supervisor-Watchdog
# Supervisor-Watchdog: startet das Add-on neu, sobald /health nicht mehr
# mit HTTP 200 antwortet (MQTT getrennt ODER Geraetekommunikation gestoert).
watchdog: "http://[HOST]:[PORT:8099]/health"
options:
  marstek_network_settings:
    device_ip: "192.168.0.45"
    device_udp_port: 30000
    device_ble_mac: ""
    device_type: ""
    local_udp_port: 0
  mqtt_settings:
    mqtt_host: "core-mosquitto"
    mqtt_port: 1883
    mqtt_username: "mqtt-marstek"
    mqtt_password: "mqtt-marstek"
    mqtt_discovery_prefix: "homeassistant"
    mqtt_base_topic: "Marstek-Bridge-Control"
    mqtt_suggested_area: "Marstek"
  message_settings:
    request_delay: 1.0
    request_timeout: 1.0
    request_retries: 2
    request_max_time: 10.0
    poll_enabled: true
    poll_interval_es_status: 10
    poll_interval_battery: 300
    poll_interval_pv: 0
    poll_interval_mode: 0
    poll_interval_em: 0
  additions_status_requests:
    enable_em: false
    dod_value: 88
    ble_block_enable: true
    led_state: false
    pv_energy_enabled: true
    pv_energy_max_gap: 300
  passiv_mode_settings:
    passive_power_min: -1200
    passive_power_max: 1200
    passive_power_default: 0
    passive_cd_time_max: 300
    passive_cd_time_default: 10
    passive_keepalive: false
    passive_keepalive_interval: 0.0
    passive_jitter: 0
    self_regulation_enabled: false
    self_regulation_topic: ""
    self_regulation_gain: 0.8
    self_regulation_average_window: 5.0
    self_regulation_export_margin: 5.0
    self_regulation_reserve: 12
    self_regulation_band_low: 0
    self_regulation_base_load: 0
    self_regulation_deadband: 10
    self_regulation_deadband_percent: 0.0
    self_regulation_stuck_limit: 3
    self_regulation_underdelivery: 25
    self_regulation_input_timeout: 60
  plan_settings:
    plan_enabled: true
    plan_forecast_topic: ""
    plan_pv_start: "12:00"
    plan_load_window: 900
    plan_target_soc: 20
    plan_charge_threshold: 100
  general_settings:
    restore_state: true
    watchdog_failure_threshold: 3
    persist_device_info: true
    health_port: 8099
  logging:
    log_level: "info"
    log_full_line_color: true
schema:
  marstek_network_settings:
    device_ip: str
    device_udp_port: int(1,65535)
    device_ble_mac: str?
    device_type: str?
    local_udp_port: int(0,65535)
  mqtt_settings:
    mqtt_host: str
    mqtt_port: int(1,65535)
    mqtt_username: str?
    mqtt_password: password?
    mqtt_discovery_prefix: str
    mqtt_base_topic: str
    mqtt_suggested_area: str?
  message_settings:
    request_delay: float(0,60)
    request_timeout: float(0.1,60)
    request_retries: int(0,10)
    request_max_time: float(0.5,300)
    poll_enabled: bool
    poll_interval_es_status: int(0,86400)
    poll_interval_battery: int(0,86400)
    poll_interval_pv: int(0,86400)
    poll_interval_mode: int(0,86400)
    poll_interval_em: int(0,86400)
  additions_status_requests:
    enable_em: bool
    dod_value: int(30,88)
    ble_block_enable: bool
    led_state: bool
    pv_energy_enabled: bool
    pv_energy_max_gap: int(10,3600)
  passiv_mode_settings:
    passive_power_min: int(-5000,0)
    passive_power_max: int(0,5000)
    passive_power_default: int(-5000,5000)
    passive_cd_time_max: int(1,3600)
    passive_cd_time_default: int(0,3600)
    passive_keepalive: bool
    passive_keepalive_interval: float(0,300)
    passive_jitter: int(0,20)
    self_regulation_enabled: bool
    self_regulation_topic: str?
    self_regulation_gain: float(0.1,1.0)
    self_regulation_average_window: float(1,60)
    self_regulation_export_margin: float(0,50)
    self_regulation_reserve: int(0,500)
    self_regulation_band_low: int(-500,500)
    self_regulation_base_load: int(0,5000)
    self_regulation_deadband: int(0,500)
    self_regulation_deadband_percent: float(0,50)
    self_regulation_stuck_limit: int(0,20)
    self_regulation_underdelivery: int(0,1000)
    self_regulation_input_timeout: int(0,3600)
  plan_settings:
    plan_enabled: true
    plan_forecast_topic: ""
    plan_pv_start: "12:00"
    plan_load_window: 900
    plan_target_soc: 20
    plan_charge_threshold: 100
  plan_settings:
    plan_enabled: bool
    plan_forecast_topic: str?
    plan_pv_start: str
    plan_load_window: int(60,7200)
    plan_target_soc: int(0,100)
    plan_charge_threshold: int(10,5000)
  general_settings:
    restore_state: bool
    watchdog_failure_threshold: int(1,100)
    persist_device_info: bool
    health_port: int(1024,65535)
  logging:
    log_level: list(trace|debug|calc|plan|info|warning|error)
    log_full_line_color: bool
